# CI: runs on every PR to main. Every step is a make target, so anything
# that fails here can be reproduced locally with the same command.
# Required checks (ruleset protect-main): "site" and "pdf".
# Rationale: docs/decisions/0010-ci-checks-and-gates.md and
# docs/decisions/0013-test-layers.md

name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  site:
    name: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make ci
      # Fast checks first, so a format, lint or type error fails in seconds.
      - run: make format-check
      - run: make lint
      - run: make typecheck
      - run: make test-unit
      - run: make build
      - run: make linkcheck
      - run: make lighthouse
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: ignore
      # No browser cache: Playwright advises against it, and the OS
      # dependencies must be installed on every run anyway (ADR 0013).
      - run: make browsers
      - run: make test-e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  pdf:
    name: pdf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: make pdf-check
